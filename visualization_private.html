    /**
     * 更新节点统计（字数、收发件数）
     */
    function updateNodeCounters(date, nodes, emailData, ocData, nodeById, hoveredNode, tooltip) {
        function normName(s) {
            if (!s) return '';
            return String(s)
                .replace(/[\u00A0\u200B-\u200D\u202F\u3000]/g, '')
                .replace(/\s+/g, '')
                .trim();
        }

        nodes.forEach(n => {
            n.sentCount = 0; n.recvCount = 0;
            n.sentWords = 0; n.recvWords = 0;
            n.recvACount = 0; n.recvAWords = 0;
        });

        const ocNameSet = new Set(ocData.map(o => o.name));
        const allNodes = nodes.slice();

        emailData.forEach(email => {
            try {
                const eDate = new Date(email.date);
                if (isNaN(eDate) || eDate > date) return;
                const added = Number(email.wordCount || 0);
                if (!added || added <= 0) return;

                const sendType = (email.sendType || '').trim();
                const letterTypeRaw = (email.letterType || '').trim();
                const letterType = letterTypeRaw ? letterTypeRaw.charAt(0).toUpperCase() : '';
                const sender = (email.sender || '').trim();
                const receiver = (email.receiver || '').trim();
                const isOCSender = ocNameSet.has(sender);
                const sNode = nodeById[sender];
                const rNode = nodeById[receiver];
                // 统计oc收到的A信+BC信
                // 统计非oc收到的C信
                if (sendType === '发') {
                    if (letterType === 'A') return;
                    if (letterType === 'B') {
                        if (sNode) {
                            sNode.sentWords = (sNode.sentWords || 0) + added;
                            sNode.sentCount = (sNode.sentCount || 0) + 1;
                        }
                        return;
                    }
                    if (letterType === 'C') {
                        if (sNode) {
                            sNode.sentWords = (sNode.sentWords || 0) + added;
                            sNode.sentCount = (sNode.sentCount || 0) + 1;
                        }
                        if (rNode) {
                            rNode.recvWords = (rNode.recvWords || 0) + added;
                            rNode.recvCount = (rNode.recvCount || 0) + 1;
                        }
                        return;
                    }
                    if (sNode) {
                        sNode.sentWords = (sNode.sentWords || 0) + added;
                        sNode.sentCount = (sNode.sentCount || 0) + 1;
                    }
                    return;
                }

                if (sendType === '收') {
                    // 收信者只可能是作为oc收到各种A\B\C信
                    // 本人发的A，计入本人数量
                    // 非本人发的A，计入该用户数量
                    if (isOCSender && letterType === 'A') {
                        if (sNode) {
                            sNode.sentWords = (sNode.sentWords || 0) + added;
                            sNode.sentCount = (sNode.sentCount || 0) + 1;
                        }
                        // 拆分收件人并统计，一般包含了自己
                        const receivers = (receiver || '').split(',').map(r => r.trim()).filter(Boolean);
                        receivers.forEach(rName => {
                            const rNode = nodeById[rName];
                            if (rNode) {
                                rNode.recvAWords = (rNode.recvAWords || 0) + added;
                                rNode.recvACount = (rNode.recvACount || 0) + 1;
                            }
                        });
                        return;
                    }
                    if (!isOCSender && letterType === 'A') {
                        if (sNode) {
                            sNode.sentWords = (sNode.sentWords || 0) + added;
                            sNode.sentCount = (sNode.sentCount || 0) + 1;
                            // 拆分收件人并统计
                            const receivers = (receiver || '').split(',').map(r => r.trim()).filter(Boolean);
                            receivers.forEach(rName => {
                                const rNode = nodeById[rName];
                                if (rNode) {
                                    rNode.recvAWords = (rNode.recvAWords || 0) + added;
                                    rNode.recvACount = (rNode.recvACount || 0) + 1;
                                }
                            });
                        }
                        return;
                    }
                    // 收信者作为oc收到BC信，计入收信者数量
                    // ✅ 只对 B 信拆分多个收件人，其他信件保持原逻辑
                    if (letterType === 'B') {
                        const receivers = (receiver || '').split(',').map(r => r.trim()).filter(Boolean);
                        if (sNode) {
                            sNode.sentWords = (sNode.sentWords || 0) + added;
                            sNode.sentCount = (sNode.sentCount || 0) + 1; // 发件人只 +1 一次
                        }
                        // 每个收件人分别 +1
                        receivers.forEach(rName => {
                            const rNode = nodeById[rName];
                            if (rNode) {
                                rNode.recvWords = (rNode.recvWords || 0) + added;
                                rNode.recvCount = (rNode.recvCount || 0) + 1;
                            }
                        });
                        return;
                    }
                    if (sNode) {
                        sNode.sentWords = (sNode.sentWords || 0) + added;
                        sNode.sentCount = (sNode.sentCount || 0) + 1;
                    }
                    if (rNode) {
                        rNode.recvWords = (rNode.recvWords || 0) + added;
                        rNode.recvCount = (rNode.recvCount || 0) + 1;
                    }
                    return;
                }
            } catch (e) {
                console.debug('[wordcount] accumulate err', e, email);
            }
        });

        try {
            if (hoveredNode && tooltip && tooltip.style.display === 'block') {
                const sent = hoveredNode.sentCount || 0;
                const sWords = hoveredNode.sentWords || 0;

                let html = `<b>发信人：</b>${hoveredNode.displayName || hoveredNode.id}` +
                    `<br><b>发出：</b>${sent} 封` +
                    `<br><b>发字数：</b>${sWords} 字`;

                // ✅ 非OC：只显示总计
                if (!hoveredNode.isOC) {
                    const recv = hoveredNode.recvCount || 0;
                    const rWords = hoveredNode.recvWords || 0;
                    html += `<br><b>收到：</b>${recv} 封` +
                        `<br><b>收字数：</b>${rWords} 字`;
                }
                // ✅ OC：分别显示 A 和 BC
                else {
                    const aRecv = hoveredNode.recvACount || 0;
                    const aWords = hoveredNode.recvAWords || 0;
                    const bcRecv = (hoveredNode.recvCount || 0);
                    const bcWords = (hoveredNode.recvWords || 0);
                    html += `<br><b>收到A：</b>${aRecv} 封 / ${aWords} 字` +
                        `<br><b>收到BC：</b>${bcRecv} 封 / ${bcWords} 字`;
                }

                tooltip.innerHTML = html;
            }
        } catch (e) { }
    }

    /**
     * 绑定时间控制器（slider/播放按钮等）
     */
    function setupTimeControls(state) {
        const { minDate, maxDate, dateState, timeSlider, timeDisplay, playButton,
            resetButton, speedOptions, filterByDate, onTick } = state;

        let playInterval = null;
        let playSpeed = 1;

        if (timeSlider) {
            timeSlider.min = 0;
            timeSlider.max = 100;
            timeSlider.value = 0;
        }

        function updateTimeDisplay(date) {
            const d = date || dateState.current;
            if (timeDisplay) timeDisplay.textContent = d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function setCurrentDateFromSliderValue(valuePercent) {
            const p = Math.max(0, Math.min(100, Number(valuePercent)));
            const timeRange = maxDate.getTime() - minDate.getTime();
            const newTime = minDate.getTime() + (timeRange * (p / 100));
            dateState.current = new Date(newTime);
            filterByDate(dateState.current);
            updateTimeDisplay(dateState.current);
            onTick();
        }

        if (timeSlider) {
            timeSlider.addEventListener('input', function () {
                setCurrentDateFromSliderValue(this.value);
            });
        }

        function startPlay() {
            if (playInterval) return;
            if (playButton) playButton.textContent = "⏸ Pause";
            playInterval = setInterval(() => {
                const step = 24 * 60 * 60 * 1000 * playSpeed;
                const next = new Date(dateState.current.getTime() + step);
                if (next >= maxDate) {
                    dateState.current = new Date(maxDate);
                    if (timeSlider) timeSlider.value = 100;
                    filterByDate(dateState.current);
                    updateTimeDisplay(dateState.current);
                    onTick();
                    clearInterval(playInterval);
                    playInterval = null;
                    if (playButton) playButton.textContent = "▶ Play";
                    return;
                }
                dateState.current = next;
                const percent = (dateState.current.getTime() - minDate.getTime()) / (maxDate.getTime() - minDate.getTime()) * 100;
                if (timeSlider) timeSlider.value = percent;
                filterByDate(dateState.current);
                updateTimeDisplay(dateState.current);
                onTick();
            }, 120);
        }

        function stopPlay() {
            if (!playInterval) return;
            clearInterval(playInterval);
            playInterval = null;
            if (playButton) playButton.textContent = "▶ Play";
        }

        function togglePlay() {
            if (playInterval) stopPlay();
            else startPlay();
        }

        if (playButton) playButton.addEventListener('click', togglePlay);
        if (resetButton) resetButton.addEventListener('click', () => {
            stopPlay();
            dateState.current = new Date(minDate);
            if (timeSlider) timeSlider.value = 0;
            filterByDate(dateState.current);
            updateTimeDisplay(dateState.current);
            onTick();
        });

        speedOptions.forEach(opt => {
            opt.addEventListener('click', function () {
                speedOptions.forEach(o => o.classList.remove('active'));
                this.classList.add('active');
                playSpeed = parseFloat(this.dataset.speed || '1');
                if (playInterval) {
                    stopPlay();
                    startPlay();
                }
            });
        });

        updateTimeDisplay();
        window.__setVisualizationDatePercent = setCurrentDateFromSliderValue;

        return { updateTimeDisplay, setCurrentDateFromSliderValue, stopPlay };
    }

    /**
     * 【新增】更新右上角的统计面板与折线图
     */
    function updateDailyStatsUI(currentDate, windowDays, dailyStatsMap) {
        // UI元素获取
        const pLetters = document.getElementById('stLetters');
        const pAtts = document.getElementById('stAtts');
        const pWords = document.getElementById('stWords');
        const pTitle = document.getElementById('stDateTitle');
        const canvas = document.getElementById('dailyChartCanvas');
        if (!canvas || !pLetters) return;
        const ctx = canvas.getContext('2d');

        // 计算日期列表（当前日期倒推 windowDays 天）
        const MS_PER_DAY = 86400000;
        const endTs = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate(), 12).getTime();
        
        const windowData = [];
        let curDayData = { recvL: 0, sentL: 0, recvA: 0, sentA: 0, recvWords: 0, sentWords: 0 }; // 【修复】包含字数重置

        for (let i = windowDays - 1; i >= 0; i--) {
            const targetD = new Date(endTs - i * MS_PER_DAY);
            const y = targetD.getFullYear();
            const m = String(targetD.getMonth() + 1).padStart(2, '0');
            const d = String(targetD.getDate()).padStart(2, '0');
            const dateStr = `${y}-${m}-${d}`;
            
            const stats = dailyStatsMap.get(dateStr) || { recvL: 0, sentL: 0, recvA: 0, sentA: 0, recvWords: 0, sentWords: 0 };
            windowData.push(stats);

            if (i === 0) curDayData = stats;
        }

        const targetDObj = new Date(endTs);
        const dispY = targetDObj.getFullYear();
        const dispM = String(targetDObj.getMonth() + 1).padStart(2, '0');
        const dispD = String(targetDObj.getDate()).padStart(2, '0');

        // 1. 更新文本面板
        pTitle.textContent = `每日总览 (${dispY}/${dispM}/${dispD})`;
        pLetters.innerHTML = `<span style="color:#00f7ff">${curDayData.recvL}</span> / <span style="color:#ff77aa">${curDayData.sentL}</span> 封`;
        pAtts.innerHTML = `<span style="color:#ffaa00">${curDayData.recvA}</span> / <span style="color:#ff8855">${curDayData.sentA}</span> 件`;
        pWords.innerHTML = `<span style="color:#ffeeaa">${curDayData.sentWords}</span> 字`;
        // Debug 输出
        console.log(`[Stats Window Debug] Date: ${dispY}-${dispM}-${dispD}, Window: ${windowDays} days`);
        console.log("Current Day Stats:", curDayData);

        // 2. 绘制折线图
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (windowDays <= 1) return; // 需要至少两个点画线

        const W = canvas.width;
        const H = canvas.height;
        const padX = 5, padY = 5;
        const drawW = W - padX * 2;
        const drawH = H - padY * 2;
        const stepX = drawW / (windowDays - 1);


        // 获取配置参数并提取需要的线条数据
        const cfg = window.__chartConfig || { lt:true, ws:true, at:true };
        const linesToDraw = [];
        let maxCount = 5, maxWord = 50; 

        // -- 组装封数和件数阵列 --
        if(cfg.lt) { const arr=windowData.map(d=>d.recvL+d.sentL); maxCount=Math.max(maxCount,...arr); linesToDraw.push({arr, maxType:'count', color:'#00f7ff'}); }
        if(cfg.ls) { const arr=windowData.map(d=>d.sentL); maxCount=Math.max(maxCount,...arr); linesToDraw.push({arr, maxType:'count', color:'#ff77aa'}); }
        if(cfg.lr) { const arr=windowData.map(d=>d.recvL); maxCount=Math.max(maxCount,...arr); linesToDraw.push({arr, maxType:'count', color:'#99ff99'}); }
        if(cfg.at) { const arr=windowData.map(d=>d.recvA+d.sentA); maxCount=Math.max(maxCount,...arr); linesToDraw.push({arr, maxType:'count', color:'#ffaa00'}); }
        if(cfg.as) { const arr=windowData.map(d=>d.sentA); maxCount=Math.max(maxCount,...arr); linesToDraw.push({arr, maxType:'count', color:'#ff8855'}); }
        if(cfg.ar) { const arr=windowData.map(d=>d.recvA); maxCount=Math.max(maxCount,...arr); linesToDraw.push({arr, maxType:'count', color:'#dddd55'}); }
        // -- 组装字数阵列 --
        if(cfg.wt) { const arr=windowData.map(d=>d.recvWords+d.sentWords); maxWord=Math.max(maxWord,...arr); linesToDraw.push({arr, maxType:'word', color:'#ffcc55'}); }
        if(cfg.ws) { const arr=windowData.map(d=>d.sentWords); maxWord=Math.max(maxWord,...arr); linesToDraw.push({arr, maxType:'word', color:'#ffeeaa'}); }
        if(cfg.wr) { const arr=windowData.map(d=>d.recvWords); maxWord=Math.max(maxWord,...arr); linesToDraw.push({arr, maxType:'word', color:'#aaffaa'}); }
 

        function drawLine(arr, maxVal, color) {
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.8;
            ctx.lineJoin = 'round';
            for (let i = 0; i < windowDays; i++) {
                const x = padX + i * stepX;
                // 反转Y轴：值越大Y越小
                const y = padY + drawH - (arr[i] / maxVal) * drawH;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        linesToDraw.forEach(item => {
            drawLine(item.arr, item.maxType === 'word' ? maxWord : maxCount, item.color);
        });
    }

    /**
     * 【新增】渲染与更新渲染附件收纳窗口内部 HTML
     * 支持参数：
     *   attachmentsData - 附件数组
     *   currentDate - 截止日期（只显示 <= currentDate 的）
     *   isDesc - 排序方向（true = 日期降序）
     *   filterType - 'all'|'收'|'发' （只显示对应类型）
     */
    function renderAttachmentList(attachmentsData, currentDate, isDesc, filterType = 'all') {
         attachmentsData = attachmentsData || [];
         const body = document.getElementById('attachListBody');
         const countSpan = document.getElementById('attachCountSpan');
         if (!body) return;
 
         // 1. 根据时间过滤
        const filtered = attachmentsData.filter(a => {
            if (!a.date) return false;
            if (new Date(a.date) > currentDate) return false;
            if (filterType === 'all') return true;
            return ((a.type || '').trim() === filterType);
        });
 
         // 2. 排序
        filtered.sort((a, b) => {
            const da = new Date(a.date).getTime();
            const db = new Date(b.date).getTime();
            return isDesc ? db - da : da - db; // true 降序（最新在上），false 升序
        });

        // 3. 构建视图
        let html = '';
        filtered.forEach(item => {
            const isRecv = (item.type || '').trim() === '收';
            const typeColor = isRecv ? '#00f7ff' : '#ff77aa';
            
            html += `
            <div class="attach-item">
                <div class="attach-item-row">
                    <span style="color:#b7c7d6">${item.date}</span>
                    <span style="color:${typeColor}; font-weight:bold;">${escapeHtml(item.type)}</span>
                </div>
                <div class="attach-item-row" style="color:#ffeeaa;">
                    ${escapeHtml(item.sender)} ➔ ${escapeHtml(item.receiver)}
                </div>
                <div class="attach-item-content">
                    ${escapeHtml(item.content)}
                </div>
            </div>`;
        });
        body.innerHTML = html;
        if(countSpan) countSpan.textContent = filtered.length;
    }




    //// ========================= 模块拆分：渲染绘制 =========================

    /**
     * 绘制星空背景
     */
    function drawStars(ctx, canvas, DPR) {
        if (!canvas._stars) return;
        ctx.save();
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        canvas._stars.forEach(s => {
            ctx.beginPath();
            ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.restore();
    }

    /**
     * 绘制连线基础层（使用二次贝塞尔曲线）
     * @param {boolean} enableLastLetterHighlight - 是否启用"未回复信件"高亮
     * @param {Map} unrepliedMap - 未回复信件映射表
     * @param {Node|null} hoveredNode - 当前悬停的节点（用于高亮过滤）
     */
function drawLinks(ctx, links, getDisplayPos, computeQuadraticControl, enableLastLetterHighlight = false, unrepliedMap = null, selectedNode = null) {
    ctx.save();
    ctx.lineCap = 'round';

    const breathFactor = 0.5 + 0.5 * Math.sin(Date.now() * 0.003);

    links.forEach(l => {
        if (!l.visible) return;
        const sPos = getDisplayPos(l.source);
        const tPos = getDisplayPos(l.target);
        const sx = sPos.x, sy = sPos.y, tx = tPos.x, ty = tPos.y;
        const ctrl = computeQuadraticControl(sx, sy, tx, ty, l.totalConnections || 1, l.offset);

        let stroke = 'rgba(150,150,150,0.7)';
        let lineWidth = l.isOCSender ? (l.type === 'C' ? 2.5 : 2) : (l.type === 'C' ? 2 : 1);
        let alpha = 0.25;

        // ✅ 亮度调整系数（基于原色）
        let brightnessMult = 1.0;
        let alphaMult = 1.0;

        // ===== 第1步：判断点击节点关联性 =====
        let isRelated = false;
        if (selectedNode) {
            isRelated = (l.source.id === selectedNode.id || l.target.id === selectedNode.id);
            if (isRelated) {
                brightnessMult = 1.2;
                alphaMult = 1.4;
                lineWidth *= 1.15;
            } else {
                brightnessMult = 0.4;
                alphaMult = 0.7;
                lineWidth *= 0.85;
            }
        }

        // ===== 第2步：C信未回复高亮逻辑（基础颜色） =====
        let isUnrepliedHighlight = false;
        if (l.type === 'C' && enableLastLetterHighlight && unrepliedMap) {
            const participants = [l.source.id, l.target.id].sort();
            const key = `${participants[0]}|${participants[1]}`;
            const unrepliedInfo = unrepliedMap.get(key);

            if (unrepliedInfo) {
                const actualSender = (l.rawLetter && l.rawLetter.sender) || l.source.id;
                const linkId = `${actualSender}|${l.date}`;
                isUnrepliedHighlight = (linkId === unrepliedInfo.lastLetterId);

                if (isUnrepliedHighlight) {
                    if (unrepliedInfo.isOCLast) {
                        // 🔴 红色高亮（呼吸动画）
                        const baseR = 110 + Math.floor(40 * breathFactor);
                        const finalR = Math.min(255, Math.floor(baseR * brightnessMult));
                        stroke = `rgba(${finalR}, 40, 40, 0.65)`;
                        lineWidth = Math.max(lineWidth, 3);
                        
                        // ✅ 关键修复：呼吸动画独立计算，不受 alphaMult 影响
                        const breathAlpha = 0.6 + 0.2 * breathFactor;
                        // 如果是相关线，可以微调基础值（但不改变呼吸幅度）
                        alpha = isRelated ? Math.min(0.95, breathAlpha + 0.15) : breathAlpha;
                        
                    } else {
                        // 🟢 绿色高亮（呼吸动画）
                        const baseG = 90 + Math.floor(70 * breathFactor);
                        const finalG = Math.min(255, Math.floor(baseG * brightnessMult));
                        stroke = `rgba(40, ${finalG}, 60, 0.65)`;
                        lineWidth = Math.max(lineWidth, 3);
                        
                        // ✅ 同样独立计算呼吸透明度
                        const breathAlpha = 0.6 + 0.2 * breathFactor;
                        alpha = isRelated ? Math.min(0.95, breathAlpha + 0.15) : breathAlpha;
                    }
                } else {
                    // 默认C信颜色（应用 alphaMult）
                    if (l.isOCSender) {
                        const baseB = 200;
                        const finalB = Math.min(255, Math.floor(baseB * brightnessMult));
                        stroke = `rgba(100, ${finalB}, 255, 0.85)`;
                    } else {
                        const baseB = 170;
                        const finalB = Math.min(255, Math.floor(baseB * brightnessMult));
                        stroke = `rgba(80, ${finalB}, 255, 0.75)`;
                    }
                    alpha = 0.25 * alphaMult;
                }
            } else {
                // 无未回复信息的C信
                if (l.isOCSender) {
                    const baseB = 200;
                    const finalB = Math.min(255, Math.floor(baseB * brightnessMult));
                    stroke = `rgba(100, ${finalB}, 255, 0.85)`;
                } else {
                    const baseB = 170;
                    const finalB = Math.min(255, Math.floor(baseB * brightnessMult));
                    stroke = `rgba(80, ${finalB}, 255, 0.75)`;
                }
                alpha = 0.25 * alphaMult;
            }
        } else {
            // ===== 第3步：非C信的原有逻辑（应用亮度系数） =====
            if (l.isOCSender) {
                if (l.type === 'B') {
                    const r = Math.min(255, Math.floor(255 * brightnessMult));
                    stroke = `rgba(${r}, 100, 100, 0.7)`;
                } else if (l.type === 'C') {
                    const b = Math.min(255, Math.floor(200 * brightnessMult));
                    stroke = `rgba(100, ${b}, 255, 0.85)`;
                }
            } else {
                if (l.type === 'A') {
                    const g = Math.min(255, Math.floor(255 * brightnessMult));
                    stroke = `rgba(0, ${g}, 255, 0.7)`;
                } else if (l.type === 'B') {
                    const r = Math.min(255, Math.floor(255 * brightnessMult));
                    stroke = `rgba(${r}, 100, 255, 0.7)`;
                } else if (l.type === 'C') {
                    const b = Math.min(255, Math.floor(170 * brightnessMult));
                    stroke = `rgba(80, ${b}, 255, 0.75)`;
                }
            }
            alpha = 0.25 * alphaMult;
        }

        // ===== 绘制 =====
        ctx.beginPath();
        ctx.strokeStyle = stroke;
        ctx.lineWidth = lineWidth;
        ctx.globalAlpha = alpha;
        ctx.moveTo(sx, sy);
        ctx.quadraticCurveTo(ctrl.cx, ctrl.cy, tx, ty);
        ctx.stroke();

        drawArrowOnCurve(ctx, sx, sy, ctrl.cx, ctrl.cy, tx, ty, stroke, 0.95);
    });
    ctx.restore();
}
    /**
     * 在二次贝塞尔曲线上绘制箭头
     */
    function drawArrowOnCurve(ctx, sx, sy, cx, cy, tx, ty, stroke, tPos = 0.95) {
        const t = Math.max(0.01, Math.min(0.99, tPos));
        const ix = (1 - t) * (1 - t) * sx + 2 * (1 - t) * t * cx + t * t * tx;
        const iy = (1 - t) * (1 - t) * sy + 2 * (1 - t) * t * cy + t * t * ty;
        const dx = 2 * (1 - t) * (cx - sx) + 2 * t * (tx - cx);
        const dy = 2 * (1 - t) * (cy - sy) + 2 * t * (ty - cy);
        const dist = Math.hypot(tx - sx, ty - sy);
        if (dist < 8) return;
        const angle = Math.atan2(dy, dx);

        const screenArrowPx = 8;
        const arrowLen = Math.max(4, screenArrowPx / Math.max(0.2, ctx._viewScale || 1));
        const arrowW = Math.max(3, arrowLen * 0.6);

        ctx.save();
        ctx.translate(ix, iy);
        ctx.rotate(angle);
        ctx.globalAlpha = 0.95;
        ctx.fillStyle = stroke || 'rgba(255,255,255,0.95)';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-arrowLen, arrowW / 2);
        ctx.lineTo(-arrowLen, -arrowW / 2);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    /**
     * 绘制 OC B 类广播线（固定角度，长度伸缩）
     */
    function drawBroadcastLines(ctx, lettersData, nodeById, getDisplayPos, currentDate) {
        ctx.save();
        ctx.lineWidth = 1.5;
        const nowSec = Date.now() / 1000;
        lettersData.forEach(letter => {
            if (letter.type !== "B" || !letter.isOCSender || !letter.isBroadcast) return;
            const senderNode = nodeById[letter.sender];
            if (!senderNode || !senderNode.visible) return;
            const letterDate = letter.dateObj ? letter.dateObj : new Date(letter.date);
            if (letterDate > currentDate) return;
            const sp = getDisplayPos(senderNode);

            const lineCount = 5;
            if (!letter._bcastState) {
                letter._bcastState = { angles: [], phases: [], baseLen: [], amps: [], speeds: [] };
                for (let ii = 0; ii < lineCount; ii++) {
                    letter._bcastState.angles[ii] = (2 * Math.PI * ii / lineCount) + (Math.random() - 0.5) * 0.06;
                    letter._bcastState.phases[ii] = Math.random() * Math.PI * 2;
                    letter._bcastState.baseLen[ii] = 28 + ii * 8 + Math.random() * 6;
                    letter._bcastState.amps[ii] = 6 + Math.random() * 16;
                    letter._bcastState.speeds[ii] = 0.6 + Math.random() * 1.2;
                }
            }
            const st = letter._bcastState;

            for (let i = 0; i < lineCount; i++) {
                const ang = st.angles[i];
                const len = st.baseLen[i] + st.amps[i] * (0.5 + 0.5 * Math.sin(st.phases[i] + nowSec * st.speeds[i]));
                const ex = sp.x + Math.cos(ang) * len;
                const ey = sp.y + Math.sin(ang) * len;

                const grad = ctx.createLinearGradient(sp.x, sp.y, ex, ey);
                grad.addColorStop(0.0, 'rgba(255,140,120,0.65)');
                grad.addColorStop(0.6, 'rgba(255,140,120,0.65)');
                grad.addColorStop(1.0, 'rgba(255,140,120,0.65)');

                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.4;
                ctx.beginPath();
                ctx.moveTo(sp.x, sp.y);
                ctx.lineTo(ex, ey);
                ctx.stroke();

                ctx.fillStyle = 'rgba(255,200,180,0.65)';
                ctx.beginPath();
                ctx.arc(ex, ey, 2.2, 0, Math.PI * 2);
                ctx.fill();
            }
        });
        ctx.restore();
    }

    /**
     * 绘制 A 环（同心圆）
     */
    function drawARings(ctx, senderRings, getNodeByName, getDisplayPos, currentDate) {
        ctx.save();
        Object.keys(senderRings).forEach(sender => {
            const owner = getNodeByName(sender);
            if (!owner || !owner.visible) return;
            const sp = getDisplayPos(owner);
            const arr = senderRings[sender];
            arr.forEach((rObj, idx) => {
                if (rObj.dateObj > currentDate) return;
                const rad = 12 + idx * 8;
                const alpha = Math.max(0.2, 0.7 - idx * 0.08);
                ctx.beginPath();
                ctx.strokeStyle = `rgba(0,255,255,${alpha})`;
                ctx.lineWidth = 1;
                ctx.globalCompositeOperation = 'lighter';
                ctx.arc(sp.x, sp.y, rad, 0, Math.PI * 2);
                ctx.stroke();
            });
        });
        ctx.globalCompositeOperation = 'source-over';
        ctx.restore();
    }

    /**
     * 绘制脉冲环（动画效果）
     */
    function drawPulseRings(ctx, pulseRings, nodeById, getDisplayPos) {
        ctx.save();
        pulseRings.forEach(p => {
            const ownerNode = nodeById[p.ownerId];
            if (!ownerNode || !ownerNode.visible) return;
            const sp = getDisplayPos(ownerNode);

            if (p.growing) {
                p.currentRadius += p.speed;
                if (p.currentRadius >= p.maxRadius) { p.currentRadius = p.maxRadius; p.growing = false; }
            } else {
                p.currentRadius -= p.speed;
                if (p.currentRadius <= p.minRadius) { p.currentRadius = p.minRadius; p.growing = true; }
            }

            const fade = 0.15 - (p.currentRadius - p.minRadius) / (p.maxRadius - p.minRadius) * 0.1;
            ctx.beginPath();
            ctx.lineWidth = 2;
            ctx.strokeStyle = `hsla(${p.colorH},100%,70%,${Math.max(0.05, fade)})`;
            ctx.arc(sp.x, sp.y, p.currentRadius, 0, Math.PI * 2);
            ctx.stroke();
        });
        ctx.restore();
    }

    /**
     * 绘制粒子（沿连线运动的光点）
     */
    function drawParticles(ctx, particles, links, getDisplayPos, computeQuadraticControl) {
        ctx.save();
        particles.forEach(pr => {
            let l = links[pr.linkIndex];
            if (!l) {
                const elig = [];
                for (let ii = 0; ii < links.length; ii++) if (links[ii].type === 'B' || links[ii].type === 'C') elig.push(ii);
                if (elig.length === 0) return;
                pr.linkIndex = elig[Math.floor(Math.random() * elig.length)];
                l = links[pr.linkIndex];
            }

            pr.position += pr.speed;
            if (pr.position > 1) {
                pr.position = Math.random() * 0.12;
                const elig = [];
                for (let ii = 0; ii < links.length; ii++) if (links[ii].type === 'B' || links[ii].type === 'C') elig.push(ii);
                if (elig.length > 0) pr.linkIndex = elig[Math.floor(Math.random() * elig.length)];
                l = links[pr.linkIndex];
            }
            if (!l || !l.visible) return;

            const sPos = getDisplayPos(l.source);
            const tPos = getDisplayPos(l.target);
            const sx = sPos.x, sy = sPos.y, tx = tPos.x, ty = tPos.y;
            const ctrl = computeQuadraticControl(sx, sy, tx, ty, l.totalConnections || 1, l.offset);
            const t = Math.max(0, Math.min(1, pr.position));
            const x = (1 - t) * (1 - t) * sx + 2 * (1 - t) * t * ctrl.cx + t * t * tx;
            const y = (1 - t) * (1 - t) * sy + 2 * (1 - t) * t * ctrl.cy + t * t * ty;

            ctx.beginPath();
            ctx.fillStyle = pr.color;
            ctx.globalAlpha = 0.95;
            ctx.arc(x, y, pr.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.restore();
    }

    /**
     * 更新节点抖动偏移
     */
    function updateNodeJitter(nodes, nodeJitter) {
        const now = Date.now();
        nodes.forEach(n => {
            const j = nodeJitter[n.id];
            if (!j) { n._dx = 0; n._dy = 0; return; }
            const t = now * j.speed + j.phase;
            n._dx = Math.sin(t) * j.ampX;
            n._dy = Math.cos(t) * j.ampY;
        });
    }

    /**
     * 绘制节点
     */
    function drawNodes(ctx, nodes, getDisplayPos) {
        ctx.save();
        nodes.forEach((n, i) => {
            if (!n.visible) return;
            const d = getDisplayPos(n);

            ctx.beginPath();
            ctx.fillStyle = n.isOC ? `hsla(${120 + (i * 12) % 360},100%,60%,0.75)` : `hsla(${180 + (i * 8) % 360},100%,55%,0.6)`;
            ctx.shadowColor = 'rgba(0,255,255,0.18)';
            ctx.shadowBlur = n.isOC ? 6 : 3;
            ctx.arc(d.x, d.y, n.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // if (n.isOC) {
            //     ctx.save();
            //     ctx.fillStyle = 'white';
            //     ctx.font = `${Math.max(8, Math.floor(n.r * 0.7))}px zpix, sans-serif`;
            //     ctx.textAlign = 'center';
            //     ctx.textBaseline = 'middle';
            //     ctx.fillText('OC', d.x, d.y);
            //     ctx.restore();
            // }
            // 取消显示oc字样
        });
        ctx.restore();
    }

    /**
     * 绘制高亮（hover 效果）
     */
    function drawHighlights(ctx, hoveredLink, hoveredNode, hoveredRing, hoveredBroadcast, getDisplayPos, computeQuadraticControl) {
        if (hoveredLink) {
            ctx.save();
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(255,255,255,0.95)';
            ctx.globalAlpha = 1;
            const l = hoveredLink;
            const sPos = getDisplayPos(l.source);
            const tPos = getDisplayPos(l.target);
            const sx = sPos.x, sy = sPos.y, tx = tPos.x, ty = tPos.y;
            const ctrl = computeQuadraticControl(sx, sy, tx, ty, l.totalConnections || 1, l.offset);
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.quadraticCurveTo(ctrl.cx, ctrl.cy, tx, ty);
            ctx.stroke();
            ctx.restore();
        }
        if (hoveredNode) {
            ctx.save();
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(0,255,255,0.95)';
            const pos = getDisplayPos(hoveredNode);
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, hoveredNode.r + 5, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
        if (hoveredRing) {
            ctx.save();
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(0,255,255,0.95)';
            const ownerPos = getDisplayPos(hoveredRing.owner);
            ctx.beginPath();
            ctx.arc(ownerPos.x, ownerPos.y, hoveredRing.rad, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
        if (hoveredBroadcast) {
            ctx.save();
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(255,255,255,0.95)';
            const sp = getDisplayPos(hoveredBroadcast.sender);
            const st = hoveredBroadcast.letter._bcastState;
            const i = hoveredBroadcast.lineIndex;
            const nowSec = Date.now() / 1000;
            const ang = st.angles[i];
            const len = st.baseLen[i] + st.amps[i] * (0.5 + 0.5 * Math.sin(st.phases[i] + nowSec * st.speeds[i]));
            const ex = sp.x + Math.cos(ang) * len;
            const ey = sp.y + Math.sin(ang) * len;
            ctx.beginPath();
            ctx.moveTo(sp.x, sp.y);
            ctx.lineTo(ex, ey);
            ctx.stroke();
            ctx.restore();
        }
    }

    /**
     * 更新节点惯性运动
     */
    function updateNodeInertia(nodes, dt) {
        const FRICTION = 0.85;
        const VELOCITY_EPS = 4e-3;
        nodes.forEach(n => {
            if (n._inertiaActive) {
                n.x += n.vx * dt;
                n.y += n.vy * dt;
                n.vx *= Math.pow(FRICTION, dt * 60);
                n.vy *= Math.pow(FRICTION, dt * 60);
                if (Math.hypot(n.vx, n.vy) < VELOCITY_EPS) {
                    n.vx = 0; n.vy = 0; n._inertiaActive = false;
                    n.fx = n.x;
                    n.fy = n.y;
                } else {
                    n.fx = null;
                    n.fy = null;
                }
            }
        });
    }

    /**
     * 创建主渲染函数（onTick）
     */
    function createRenderLoop(state) {
        const { canvas, ctx, DPR, view, nodes, links, lettersData, nodeById,
            senderRings, pulseRings, particles, nodeJitter, dateState, minDate,
            getDisplayPos, getNodeByName, computeQuadraticControl,
            interactionHandlers, ocData, dailyStatsMap } = state; 

        let lastChartUpdateDayStr = ""; 
        let lastChartUpdateWindow = -1;

        // 【新增】附件面板缓存校验字段
        let lastAttachUpdateDayStr = "";
        window.__attachSortDesc = true;
        window.__attachSortChanged = true;

        function onTick() {
            if (!dateState.current || !(dateState.current instanceof Date)) {
                dateState.current = new Date(minDate);
            }

            nodes.forEach(n => { n.visible = n.registerDateObj <= dateState.current; });
            links.forEach(l => {
                l.visible = (l.source.registerDateObj <= dateState.current) &&
                    (l.target.registerDateObj <= dateState.current) &&
                    (l.dateObj <= dateState.current);
            });

            const now = Date.now();
            if (typeof onTick._lastNow === 'undefined') onTick._lastNow = now;
            const dt = Math.min(40, now - onTick._lastNow) / 1000;
            onTick._lastNow = now;

            updateNodeInertia(nodes, dt);

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.setTransform(DPR * view.scale, 0, 0, DPR * view.scale, DPR * view.tx, DPR * view.ty);
            ctx._viewScale = view.scale;

            const toggleLastLetter = document.getElementById('toggleLastLetter');
            const enableLastLetterHighlight = toggleLastLetter ? toggleLastLetter.checked : false;
            let unrepliedMap = null;

            if (enableLastLetterHighlight) {
                const ocNameSet = new Set((ocData || []).map(oc => oc.name));
                const visibleLetters = lettersData.filter(l => {
                    const ld = new Date(l.date);
                    return ld <= dateState.current;
                });
                unrepliedMap = computeUnrepliedCLetters(visibleLetters, dateState.current, ocNameSet);
            }

            // ✅ 获取选中节点（不再用 hoveredNode）
            const selectedNode = interactionHandlers.getSelectedNode();
            const hoveredLink = interactionHandlers.getHoveredLink();
            const hoveredRing = interactionHandlers.getHoveredRing();
            const hoveredBroadcast = interactionHandlers.getHoveredBroadcast();

            // 绘制（传入 selectedNode）
            drawStars(ctx, canvas, DPR);
            drawLinks(ctx, links, getDisplayPos, computeQuadraticControl, enableLastLetterHighlight, unrepliedMap, selectedNode);
            drawBroadcastLines(ctx, lettersData, nodeById, getDisplayPos, dateState.current);
            drawARings(ctx, senderRings, getNodeByName, getDisplayPos, dateState.current);
            drawPulseRings(ctx, pulseRings, nodeById, getDisplayPos);
            drawParticles(ctx, particles, links, getDisplayPos, computeQuadraticControl);
            updateNodeJitter(nodes, nodeJitter);
            drawNodes(ctx, nodes, getDisplayPos);


            // ✅ 高亮选中节点（用原 hoveredNode 逻辑）
            const hoveredNode = interactionHandlers.getHoveredNode();
            drawHighlights(ctx, hoveredLink, selectedNode || hoveredNode, hoveredRing, hoveredBroadcast, getDisplayPos, computeQuadraticControl);

            // 【新增】每帧检查与更新右上角每日统计面板
            const panelEl = document.getElementById('dailyStatsPanel');
            const toggleCb = document.getElementById('toggleDailyStats');
            const windowInput = document.getElementById('dailyChartWindow');
            
            if (toggleCb && toggleCb.checked) {
                if (panelEl.style.display !== 'block') panelEl.style.display = 'block';
                
                const curDayStr = dateState.current.toISOString().slice(0, 10);
                const curWin = parseInt(windowInput.value) || 14;
                
                if (curDayStr !== lastChartUpdateDayStr || curWin !== lastChartUpdateWindow || window.__forceChartRedraw) {
                    updateDailyStatsUI(dateState.current, curWin, dailyStatsMap);
                    lastChartUpdateDayStr = curDayStr;
                    lastChartUpdateWindow = curWin;
                    window.__forceChartRedraw = false;
                }
            } else {
                if (panelEl && panelEl.style.display !== 'none') panelEl.style.display = 'none';
            }

            // 【新增】每帧检查与更新侧边附件收纳窗
            const attachCb = document.getElementById('toggleAttachmentWindow');
            const attachPanel = document.getElementById('attachmentListWindow');
            if (attachCb && attachCb.checked) {
                if (attachPanel.style.display !== 'flex') attachPanel.style.display = 'flex';
                
                const curDayStr = dateState.current.toISOString().slice(0, 10);
                if (curDayStr !== lastAttachUpdateDayStr || window.__attachSortChanged) {
                    // 【修复】加上了 window.__attachFilterType 保证筛选能生效
                    renderAttachmentList(window.__globalAttachmentsData, dateState.current, window.__attachSortDesc, window.__attachFilterType || 'all');
                    lastAttachUpdateDayStr = curDayStr;
                    window.__attachSortChanged = false;
                }
            } else {
                if (attachPanel && attachPanel.style.display !== 'none') attachPanel.style.display = 'none';
            }
        }

        return onTick;
    }

    /**
     * HTML 转义
     */
    function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/[&<>"']/g, ch => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": "&#39;"
        }[ch]));
    }

    /**
     * 解析信件路径为可尝试的候选 URL 列表
     * @param {string} rawPath - 原始路径（可能是绝对路径或相对路径）
     * @returns {string[]} - 候选 URL 数组
     */
    function resolveLetterCandidates(rawPath) {
        if (!rawPath) return [];
        let p = rawPath.replace(/\\/g, '/').trim();

        // 【修复】优先提取项目相对路径（避免使用会被浏览器 CORS 封杀的 file:///）
        const idx = p.indexOf('/email/');
        if (idx !== -1) {
            p = '.' + p.slice(idx);
        } else {
            const m = p.match(/.*(email\/.*)$/i);
            if (m && m[1]) p = './' + m[1];
        }

        // 如果连上面都没命中，才死马当活马医尝试保留绝对协议
        if (/^[A-Za-z]:\//.test(p) && p.indexOf('./') !== 0) {
            p = `file:///${p}`;
        }

        p = p.replace(/\/+$/, '');

        // ✅ 关键：在拼接路径之前就对 # 进行编码
        p = p.replace(/#/g, '%23');

        // 只保留 content.txt
        const candidates = [];
        const contentPath = `${p}/content.txt`;
        candidates.push(contentPath);

        return [...new Set(candidates)];
    }

    /**
     * 绑定其他画布事件（双击适配、滚轮缩放）
     */
    function setupCanvasEvents(canvas, nodes, view, width, height, tooltip) {
        // 双击适配视图
        canvas.addEventListener('dblclick', (evt) => {
            view.scale = 1;
            view.tx = 0;
            view.ty = 0;
            const newView = computeFitInternal(nodes, width, height, view);
            view.scale = newView.scale;
            view.tx = newView.tx;
            view.ty = newView.ty;
        });

        // 滚轮缩放
        canvas.addEventListener('wheel', (evt) => {
            evt.preventDefault();
            const delta = -evt.deltaY;
            const zoomFactor = Math.exp(delta * 0.0012);
            const rect = canvas.getBoundingClientRect();
            const cssX = evt.clientX - rect.left;
            const cssY = evt.clientY - rect.top;
            const wx = (cssX - view.tx) / view.scale;
            const wy = (cssY - view.ty) / view.scale;
            let newScale = view.scale * zoomFactor;
            newScale = Math.max(0.02, Math.min(4, newScale));
            view.tx = cssX - wx * newScale;
            view.ty = cssY - wy * newScale;
            view.scale = newScale;
            if (tooltip && tooltip.style.display === 'block') {
                tooltip.style.left = (evt.clientX + 12) + 'px';
                tooltip.style.top = (evt.clientY - 20) + 'px';
            }
        }, { passive: false });
    }


    //// ========================= 模块拆分：几何计算辅助函数 =========================

    /**
     * 获取节点当前显示位置（考虑抖动偏移）
     */
    function createGetDisplayPos() {
        return function (n) {
            return { x: n.x + (n._dx || 0), y: n.y + (n._dy || 0) };
        };
    }

    /**
     * 计算二次贝塞尔曲线的控制点（多连线交替分布）
     */
    function createComputeQuadraticControl() {
        return function (sourceX, sourceY, targetX, targetY, total, offset) {
            const center = (total - 1) / 2;
            const idx = offset ? (offset / 3 + center) : 0;
            const delta = idx - center;
            const BASE_CURVE = 20;
            const magnitude = Math.abs(delta) + 0.5;
            const sign = (Math.round(Math.abs(delta)) % 2 === 0) ? 1 : -1;
            const curve = BASE_CURVE * magnitude * sign;

            const dx = targetX - sourceX;
            const dy = targetY - sourceY;
            const len = Math.hypot(dx, dy) || 1;
            const cx = (sourceX + targetX) / 2 + curve * (dy) / len;
            const cy = (sourceY + targetY) / 2 - curve * (dx) / len;
            return { cx, cy };
        };
    }

    /**
     * 计算点到二次贝塞尔曲线的最短距离
     */
    function createDistancePointToQuadratic() {
        return function (px, py, x0, y0, cx, cy, x1, y1, steps = 28) {
            let minDist = Infinity;
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const ix = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * cx + t * t * x1;
                const iy = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * cy + t * t * y1;
                const d = Math.hypot(px - ix, py - iy);
                if (d < minDist) minDist = d;
            }
            return minDist;
        };
    }

    /**
     * 创建初始视图状态
     */
    function createInitialView() {
        return { scale: 1, tx: 0, ty: 0 };
    }

    /**
     * 绑定窗口 resize 事件
     */
    function setupResizeHandler(resizeCanvas, timeScale, nodes, links, view, width, height) {
        window.addEventListener('resize', () => {
            resizeCanvas();
            if (typeof timeScale !== 'undefined' && timeScale.range) {
                timeScale.range([width() * 0.1, width() * 0.9]);
            }
            const newView = computeInitialLayout(nodes, links, timeScale, view, width(), height(), 300);
            view.scale = newView.scale;
            view.tx = newView.tx;
            view.ty = newView.ty;
        });
    }

    /**
     * 初始化时间过滤函数
     */
    function createFilterByDate(nodes, links, emailData, ocData, nodeById, getHoveredNode, tooltip) {
        return function (date) {
            nodes.forEach(n => n.visible = n.registerDateObj <= date);
            links.forEach(link => {
                const sourceVisible = link.source && link.source.registerDateObj && link.source.registerDateObj <= date;
                const targetVisible = link.target && link.target.registerDateObj && link.target.registerDateObj <= date;
                link.visible = sourceVisible && targetVisible && link.dateObj <= date;
            });
            const hoveredNode = getHoveredNode ? getHoveredNode() : null;
            updateNodeCounters(date, nodes, emailData, ocData, nodeById, hoveredNode, tooltip);
        };
    }


    async function initVisualization() {
        // 1. 加载数据
        const { ocData, emailData, attachmentData } = await loadEmailData(); 
        const processed = buildVisualizationData(ocData, emailData, attachmentData); 
        const { usersData, lettersData, attachmentsData, dailyStatsMap } = processed; // 【修改】解构出 dailyStatsMap

        // 2. 计算时间范围
        let { minDate, maxDate, playInterval, playSpeed } = computeTimeState(usersData, lettersData);
        const dateState = { current: new Date(minDate) };

        // 3. 初始化画布
        const { container, canvas, ctx, DPR, tooltip, resizeCanvas, width, height } = setupCanvasAndTooltip();

        // 4. 构建时间刻度
        const dateExtent = d3.extent(usersData, d => new Date(d.registerDate));
        const timeScale = d3.scaleTime().domain(dateExtent).range([width * 0.1, width * 0.9]);

        // 5. 构建数据结构
        const { nodes, nodeById, nodeByNormName, getNodeByName, nodeJitter } = buildNodesData(usersData, timeScale, height);
        const links = buildLinksData(lettersData, nodeById);
        const senderRings = buildSenderRings(emailData);
        const particles = initParticles(links);
        const pulseRings = initPulseRings(nodes);
        initStars(canvas, width, height);

        // 6. 创建辅助函数与初始视图
        const getDisplayPos = createGetDisplayPos();
        const computeQuadraticControl = createComputeQuadraticControl();
        const distancePointToQuadratic = createDistancePointToQuadratic();
        let view = createInitialView();
        view = computeInitialLayout(nodes, links, timeScale, view, width, height, 300);

        // 7. 绑定交互
        const interactionState = { canvas, nodes, links, view, tooltip, senderRings, nodeById, getDisplayPos, computeQuadraticControl, distancePointToQuadratic, width, height, dateState, lettersData };
        const interactionHandlers = setupInteractions(interactionState);

        // 8. 启动渲染
        const renderState = {
            canvas, ctx, DPR, view, nodes, links, lettersData, nodeById,
            senderRings, pulseRings, particles, nodeJitter, dateState, minDate,
            getDisplayPos, getNodeByName, computeQuadraticControl,
            interactionHandlers, ocData, 
            dailyStatsMap // 【新增】传入主渲染循环
        };
        const onTick = createRenderLoop(renderState);
        function continuousRender() { onTick(); requestAnimationFrame(continuousRender); }
        continuousRender();

        // 9. 初始化弹窗与事件
        initEmailPopupSystem();
        setupCanvasEvents(canvas, nodes, view, width, height, tooltip);

        // 【新增备用存储】
        window.__globalAttachmentsData = attachmentsData; 

        // 10. 绑定时间控制
        const timeSlider = document.getElementById('timeSlider');

        const timeDisplay = document.getElementById('timeDisplay');
        const playButton = document.getElementById('playButton');
        const resetButton = document.getElementById('resetButton');
        const speedOptions = document.querySelectorAll('.speed-option');
        const filterByDate = createFilterByDate(nodes, links, emailData, ocData, nodeById, () => interactionHandlers.getHoveredNode(), tooltip);
        const timeControlState = { minDate, maxDate, dateState, timeSlider, timeDisplay, playButton, resetButton, speedOptions, filterByDate, onTick };
        setupTimeControls(timeControlState);

        // 11. 初始化时间轴
        dateState.current = new Date(minDate);
        if (timeSlider) timeSlider.value = 0;
        filterByDate(dateState.current);
    }


</script>

<div id="introOverlay">
    <div class="intro-center">
        <div class="intro-title">CrackPost Visualization</div>
        <button id="introSelectBtn">选择 email 目录</button>

<script>
    /* 覆盖原自动初始化：仅在引导结束后调用（脚本逻辑增强） */
    window.__preloadedData = null;

    (function () {
        const origFetch = window.fetch.bind(window);
        let localFilesMap = null;

        function normPath(p) { return String(p || '').replace(/\\/g, '/').replace(/^\.\/+/, '').replace(/^\/+/, '').replace(/\/+/g, '/'); }
        function guessContentType(p) {
            p = p.toLowerCase();
            if (p.endsWith('.tsv')) return 'text/tab-separated-values; charset=utf-8';
            if (p.endsWith('.txt')) return 'text/plain; charset=utf-8';
            return 'text/plain; charset=utf-8';
        }

        // 引导界面元素
        const overlay = document.getElementById('introOverlay');
        const selectBtn = document.getElementById('introSelectBtn');
        const progressWrap = document.querySelector('.intro-progress-wrap');
        const progressGrid = document.getElementById('introProgressGrid');
        const linesBox = document.getElementById('introLines');

        const PROG_SQUARES = 20;
        function buildSquares() {
            progressGrid.innerHTML = '';
            for (let i = 0; i < PROG_SQUARES; i++) {
                const s = document.createElement('div');
                s.className = 'sq';
                progressGrid.appendChild(s);
            }
        }
        function setProgress(p) { // p: 0~1
            const squares = progressGrid.children;
            const active = Math.max(0, Math.min(PROG_SQUARES, Math.floor(PROG_SQUARES * p)));
            for (let i = 0; i < squares.length; i++) squares[i].classList.toggle('on', i < active);
        }

        async function enableLocalEmailDirMode() {
            return new Promise(resolve => {
                const input = document.createElement('input');
                input.type = 'file'; input.webkitdirectory = true; input.multiple = true; input.style.display = 'none';
                document.body.appendChild(input);
                input.addEventListener('change', async e => {
                    try {
                        const files = Array.from(e.target.files || []);
                        if (!files.length) { alert('未选择任何文件'); resolve(false); return; }
                        const map = new Map();
                        files.forEach(f => {
                            const rel = f.webkitRelativePath || f.name;
                            const key = normPath(rel).toLowerCase();
                            map.set(key, f);
                            if (!key.startsWith('email/')) map.set(('email/' + key).toLowerCase(), f);
                            else map.set(key.replace(/^email\//, ''), f);
                        });
                        if (!map.has('email/global_result.tsv') && !map.has('global_result.tsv')) {
                            alert('请选择包含 email/global_result.tsv 的目录（请直接选中 email 文件夹）');
                            resolve(false); return;
                        }
                        localFilesMap = map;

                        // 拦截 fetch
                        window.fetch = async function (resource, init) {
                            try {
                                let url = (typeof resource === 'string') ? resource : (resource && resource.url) || '';
                                let key = url.replace(/^file:\/+/, '').split('?')[0].split('#')[0];

                                // 【核心修复】多层解码循环，撕开浏览器加上的 %2523..
                                let decodeLimit = 3;
                                while (key.includes('%') && decodeLimit > 0) {
                                    let prev = key;
                                    try { key = decodeURIComponent(key); } catch(e) { break; }
                                    if (prev === key) break;
                                    decodeLimit--;
                                }

                                key = normPath(key).toLowerCase();
                                if (key.startsWith('./')) key = key.slice(2);
                                if (key.startsWith('.')) key = key.slice(1);
                                if (key.startsWith('/')) key = key.slice(1);
                                if (!key.startsWith('email/') && key.indexOf('/email/') >= 0)
                                    key = key.slice(key.indexOf('/email/') + 1);
                                
                                if (localFilesMap) {
                                    // 1. 常规精准匹配
                                    if (localFilesMap.has(key)) {
                                        const file = localFilesMap.get(key);
                                        const text = await file.text();
                                        return new Response(text, { status: 200, headers: { 'Content-Type': guessContentType(key) } });
                                    }
                                    // 2. 尾部模糊匹配 (对付如 #和中文夹杂所产生的匹配死角)
                                    const fallbackKey = Array.from(localFilesMap.keys()).find(mk => key.endsWith(mk) || mk.endsWith(key) || key.includes(mk));
                                    if (fallbackKey) {
                                        const file = localFilesMap.get(fallbackKey);
                                        const text = await file.text();
                                        return new Response(text, { status: 200, headers: { 'Content-Type': guessContentType(fallbackKey) } });
                                    }
                                }
                            } catch (e) { console.debug('[local-fetch fallback]', e); }
                            return origFetch(resource, init);
                        };

                        // 预加载并启动引导
                        window.loadEmailData().then(d => {
                            window.__preloadedData = d;
                            startIntroTyping(d);
                            resolve(true);
                        }).catch(err => {
                            console.error('预加载失败', err);
                            resolve(false);
                        });
                    } finally { input.remove(); }
                });
                input.click();
            });
        }

        selectBtn.addEventListener('click', async () => { await enableLocalEmailDirMode(); });

        function formatDate(dStr) {
            const d = new Date(dStr); if (isNaN(d)) return dStr;
            const y = d.getFullYear(), m = ('0' + (d.getMonth() + 1)).slice(-2), da = ('0' + d.getDate()).slice(-2);
            return `${y}年${m}月${da}日`;
        }

        function startIntroTyping(data) {
            selectBtn.style.display = 'none';
            progressWrap.style.display = 'flex';
            buildSquares();
            setProgress(0);
            linesBox.innerHTML = '';

            const ocSet = new Set((data.ocData || []).map(o => (o.name || '').trim()).filter(Boolean));
            const { usersData } = processEmailData(data.ocData || [], data.emailData || []);
            const userCount = usersData.length;
            const letterCount = (data.emailData || []).length;
            const attachCount = (data.attachmentData || []).length; // 【新增】获取附件总数

            const dates = [...(data.ocData || []).map(o => o.registerDate), ...(data.emailData || []).map(e => e.date)]
                .filter(Boolean).sort();
            const minD = dates.length ? dates[0] : new Date().toISOString().slice(0, 10);
            const maxD = dates.length ? dates[dates.length - 1] : minD;

            const lines = [
                `正在检索从 ${formatDate(minD)} 到 ${formatDate(maxD)} 的通信记录`,
                `正在联系 ${userCount} 位笔友`,
                `正在邮递 ${letterCount} 封信`,
                `正在搬运 ${attachCount} 件包裹`,  // 【新增】包含这行引导信息
                `Crackpost可视化即将启动，请稍候...`
            ];

            // ===== 新增：时间驱动进度条（均匀推进） =====
            const charDelay = 50;       // 单字符打字延时 (ms) 可再调慢
            const linePause = 500;     // 每行完成后的停顿 (ms)
            const perLineCharCounts = lines.map(l => l.length);
            // 总时长 = Σ(字符数*charDelay) + 行间停顿(最后一行无停顿)
            const totalDuration =
                perLineCharCounts.reduce((sum, c) => sum + c * charDelay, 0) +
                linePause * (lines.length - 1);

            let typingDone = false;
            let timeDone = false;
            const startTs = performance.now();

            function progressLoop() {
                const elapsed = performance.now() - startTs;
                let p = Math.min(1, elapsed / totalDuration);
                setProgress(p);
                if (p >= 1) {
                    timeDone = true;
                    tryFinish();
                    return;
                }
                requestAnimationFrame(progressLoop);
            }
            progressLoop();

            function tryFinish() {
                if (typingDone && timeDone) {
                    // 与原 finishIntro 行为一致
                    setTimeout(() => {
                        overlay.classList.add('fade-out');
                        setTimeout(() => {
                            overlay.remove();
                            if (window.__preloadedData) initVisualizationWithPreloaded(window.__preloadedData);
                            else initVisualization();
                        }, 800);
                    }, 300);
                }
            }

            let lineIndex = 0;
            function writeLine() {
                if (lineIndex >= lines.length) {
                    typingDone = true;
                    tryFinish();
                    return;
                }
                linesBox.innerHTML = '';
                const text = lines[lineIndex];
                const lineDiv = document.createElement('div');
                lineDiv.className = 'intro-line';
                linesBox.appendChild(lineDiv);

                let ci = 0;
                (function typeChar() {
                    if (ci >= text.length) {
                        lineIndex++;
                        setTimeout(writeLine, linePause);
                        return;
                    }
                    const span = document.createElement('span');
                    span.className = 'char';
                    span.textContent = text[ci];
                    lineDiv.appendChild(span);
                    ci++;
                    setTimeout(typeChar, charDelay);
                })();
            }
            writeLine();
        }


        // 用预加载数据初始化（原逻辑保持不变）
        function initVisualizationWithPreloaded(d) {
            const { ocData, emailData, attachmentData } = d; 
            const processed = buildVisualizationData(ocData, emailData, attachmentData); 
            // 【修复】加上 dailyStatsMap 的解构
            const { usersData, lettersData, attachmentsData, dailyStatsMap } = processed; 
            
            let { minDate, maxDate } = computeTimeState(usersData, lettersData);
            const dateState = { current: new Date(minDate) };
            const { container, canvas, ctx, DPR, tooltip, resizeCanvas, width, height } = setupCanvasAndTooltip();
            const dateExtent = d3.extent(usersData, d => new Date(d.registerDate));
            const timeScale = d3.scaleTime().domain(dateExtent).range([width * 0.1, width * 0.9]);
            const { nodes, nodeById, getNodeByName, nodeJitter } = buildNodesData(usersData, timeScale, height);
            const links = buildLinksData(lettersData, nodeById);
            const senderRings = buildSenderRings(emailData);
            const particles = initParticles(links);
            const pulseRings = initPulseRings(nodes);
            initStars(canvas, width, height);
            const getDisplayPos = createGetDisplayPos();
            const computeQuadraticControl = createComputeQuadraticControl();
            const distancePointToQuadratic = createDistancePointToQuadratic();
            let view = createInitialView();
            view = computeInitialLayout(nodes, links, timeScale, view, width, height, 300);
            const interactionState = { canvas, nodes, links, view, tooltip, senderRings, nodeById, getDisplayPos, computeQuadraticControl, distancePointToQuadratic, width, height, dateState, lettersData };
            const interactionHandlers = setupInteractions(interactionState);
            
            // 【修复】在渲染状态对象中追加传入 dailyStatsMap !!!
            const renderState = { canvas, ctx, DPR, view, nodes, links, lettersData, nodeById, senderRings, pulseRings, particles, nodeJitter, dateState, minDate, getDisplayPos, getNodeByName, computeQuadraticControl, interactionHandlers, ocData, dailyStatsMap };
            
            const onTick = createRenderLoop(renderState);
            (function loop() { onTick(); requestAnimationFrame(loop); })();

            initEmailPopupSystem();
            setupCanvasEvents(canvas, nodes, view, width, height, tooltip);

            // 【后续备用】此时我们其实已经可以在外部或特定状态里把 attachmentsData 绑定给 UI 面板的渲染函数了
            window.__globalAttachmentsData = attachmentsData; 
            
            const timeSlider = document.getElementById('timeSlider');
            const timeDisplay = document.getElementById('timeDisplay');
            const playButton = document.getElementById('playButton');
            const resetButton = document.getElementById('resetButton');
            const speedOptions = document.querySelectorAll('.speed-option');
            const filterByDate = createFilterByDate(nodes, links, emailData, ocData, nodeById, () => interactionHandlers.getHoveredNode(), tooltip);
            setupTimeControls({ minDate, maxDate, dateState, timeSlider, timeDisplay, playButton, resetButton, speedOptions, filterByDate, onTick });
            dateState.current = new Date(minDate);
            if (timeSlider) timeSlider.value = 0;
            filterByDate(dateState.current);
        }

        // 禁止自动加载，等待用户选择
        document.removeEventListener('DOMContentLoaded', initVisualization);
    })();

    document.addEventListener('DOMContentLoaded', function () {
        const btn = document.getElementById('flagMenuBtn');
        const popup = document.getElementById('flagMenuPopup');
        const closeBtn = document.getElementById('flagMenuCloseBtn');
        btn.onclick = () => { popup.style.display = 'block'; };
        closeBtn.onclick = () => { popup.style.display = 'none'; };
        // 点击弹窗外部关闭
        document.addEventListener('mousedown', function (e) {
            if (popup.style.display === 'block' && !popup.contains(e.target) && e.target !== btn) {
                popup.style.display = 'none';
            }
        });

        // 【新增拖拽及交互】附件收纳窗口拖动与关闭、排序
        const attachWin = document.getElementById('attachmentListWindow');
        const attachHdr = document.getElementById('attachHdr');
        let attachIsDragging = false, attachDragDX = 0, attachDragDY = 0;

        if (attachHdr && attachWin) {
            attachHdr.addEventListener('mousedown', (e) => {
                const tag = e.target.tagName.toLowerCase();
                // 放行按钮和下拉框的点击，不要将其识别为拖拽窗口
                if (tag === 'button' || tag === 'select' || tag === 'option') return;
                
                attachIsDragging = true;
                const rect = attachWin.getBoundingClientRect();
                attachDragDX = e.clientX - rect.left;
                attachDragDY = e.clientY - rect.top;
                e.preventDefault();
            });
            document.addEventListener('mousemove', (e) => {
                if (!attachIsDragging) return;
                attachWin.style.left = (e.clientX - attachDragDX) + 'px';
                attachWin.style.top = (e.clientY - attachDragDY) + 'px';
                attachWin.style.bottom = 'auto'; // 解除CSS的bottom限制
            });
            document.addEventListener('mouseup', () => { attachIsDragging = false; });
        }

        // 关闭按钮
        const attachCloseBtn = document.getElementById('attachCloseBtn');
        const attachToggleCb = document.getElementById('toggleAttachmentWindow');
        if (attachCloseBtn && attachToggleCb) {
            attachCloseBtn.addEventListener('click', () => {
                attachWin.style.display = 'none';
                attachToggleCb.checked = false; // 同步取消勾选设定
            });
        }

        // 排序选项
        const attachSortBtn = document.getElementById('attachSortBtn');
        if (attachSortBtn) {
            attachSortBtn.addEventListener('click', () => {
                window.__attachSortDesc = !window.__attachSortDesc;
                attachSortBtn.textContent = window.__attachSortDesc ? '倒序' : '正序';
                window.__attachSortChanged = true;
            });
        }
        
        const attachFilterSelect = document.getElementById('attachFilterSelect');
        if (attachFilterSelect) {
            window.__attachFilterType = attachFilterSelect.value || 'all';
            attachFilterSelect.addEventListener('change', () => {
                window.__attachFilterType = attachFilterSelect.value || 'all';
                window.__attachSortChanged = true;
            });
        }

       // ============ 新增：折线图参数配置的交互逻辑 ============
       const openCfBtn = document.getElementById('openChartConfigBtn');
       const cfPopup = document.getElementById('chartConfigPopup');
       const closeCfBtn = document.getElementById('closeChartConfigBtn');
       
       if(openCfBtn && cfPopup) {
           openCfBtn.onclick = () => { cfPopup.style.display = 'block'; };
           closeCfBtn.onclick = () => { cfPopup.style.display = 'none'; };
           // 点击弹窗外部关闭
           document.addEventListener('mousedown', function (e) {
               if (cfPopup.style.display === 'block' && !cfPopup.contains(e.target) && e.target !== openCfBtn) {
                   cfPopup.style.display = 'none';
               }
           });
           
           // 绑定数据状态同步
           window.__chartConfig = { lt:true, ls:false, lr:false, at:true, as:false, ar:false, ws:true, wr:false, wt:false };
           const keys = ['lt', 'ls', 'lr', 'at', 'as', 'ar', 'ws', 'wr', 'wt'];
           keys.forEach(k => {
               const cb = document.getElementById('cc_' + k);
               if (cb) {
                   cb.addEventListener('change', (e) => {
                       window.__chartConfig[k] = e.target.checked;
                       window.__forceChartRedraw = true; // 强制视图下一帧重绘
                   });
               }
           });
       }
    });
</script>
